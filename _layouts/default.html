<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#1e4f40">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" href="{{ '/assets/images/site-icon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/assets/images/site-icon-32.png' | relative_url }}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/images/site-icon-180.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/record.css' | relative_url }}">
    {% assign asset_version = site.github.build_revision | default: site.time %}
    <script src="{{ '/assets/js/bookshelf.js' | relative_url }}?v={{ asset_version | uri_escape }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell site-header__inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Reading Log ホーム">
          <span class="brand__mark" aria-hidden="true">R</span>
          <span>
            <strong>Reading Log</strong>
            <small>個人の読書記録</small>
          </span>
        </a>
        <nav class="nav" aria-label="メインナビゲーション">
          <a href="{{ '/' | relative_url }}">本棚</a>
          <a href="{{ '/record/' | relative_url }}">記録する</a>
          <a href="{{ '/reviews/latest/' | relative_url }}">最新レビュー</a>
          <a href="https://github.com/{{ site.repository }}">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="shell main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <p>本、進捗、メモの記録。</p>
        <a href="https://github.com/{{ site.repository }}">Source on GitHub</a>
      </div>
    </footer>
  </body>
</html>
